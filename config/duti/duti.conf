# duti config file. Applied on every darwin-rebuild switch by the
# `duti` activation script in modules/home.nix.
#
# Format: <bundle identifier>  <UTI | .extension | mime/type>  <role>
# role is one of: all, editor, viewer, shell, none
#
# Find a bundle ID with:
#   mdls -name kMDItemCFBundleIdentifier /Applications/Foo.app
# Find the UTI for an existing file with:
#   mdls -name kMDItemContentType /path/to/file

# --- Video (VLC) ---
org.videolan.vlc	public.mpeg-4	all
org.videolan.vlc	.mp4	all
org.videolan.vlc	.m4v	all
org.videolan.vlc	.mkv	all
org.videolan.vlc	.avi	all
org.videolan.vlc	.webm	all
org.videolan.vlc	com.apple.quicktime-movie	all
org.videolan.vlc	.mov	all

# --- Web (Arc) ---
company.thebrowser.Browser	public.html	all
company.thebrowser.Browser	.html	all
company.thebrowser.Browser	.htm	all
company.thebrowser.Browser	http	all
company.thebrowser.Browser	https	all

# --- Code (Zed) ---
# nvim can't go here: it's a terminal program, not a .app bundle, so
# Finder/Launch Services has no bundle ID for it to hand files to.
dev.zed.Zed	.js	all
dev.zed.Zed	.jsx	all
dev.zed.Zed	.ts	all
dev.zed.Zed	.tsx	all
dev.zed.Zed	.json	all
dev.zed.Zed	.md	all
dev.zed.Zed	.py	all
dev.zed.Zed	.rb	all
dev.zed.Zed	.go	all
dev.zed.Zed	.rs	all
dev.zed.Zed	.c	all
dev.zed.Zed	.h	all
dev.zed.Zed	.cpp	all
dev.zed.Zed	.hpp	all
dev.zed.Zed	.css	all
dev.zed.Zed	.scss	all
dev.zed.Zed	.yaml	all
dev.zed.Zed	.yml	all
dev.zed.Zed	.toml	all
